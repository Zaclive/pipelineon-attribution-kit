services:
  attribution:
    build: .
    ports:
      - "127.0.0.1:4310:4310"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      KIT_DATABASE: /app/data/attribution.sqlite
    volumes:
      - attribution-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  attribution-data:
